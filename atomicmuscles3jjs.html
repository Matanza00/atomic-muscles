/* Atomic Muscles v2. Layout and type follow the reference recording: Anton headlines, amber accents, centred
   section heads and card grids. The ground stays the warm black with the glow, grain and three.js ember field. */
:root{
  color-scheme:dark;
  --bg:#070608; --bg-2:#0C0B0D; --card:#111014; --card-2:#18171C; --card-3:#1F1E24;
  --line:rgba(255,240,220,.08); --line-2:rgba(255,240,220,.15);
  --ink:#F6F3EE; --ink-2:#C6C0B7; --mute:#8C867D;
  --amber:#F4A63A; --amber-2:#FFC86A; --amber-3:#E3891F; --flame:#FF7A1A; --wa:#1FB957;
  --grad:linear-gradient(90deg,#F29C30 0%,#F8B24A 55%,#FFCB70 100%);
  --amber-text:linear-gradient(180deg,#FFC45E 0%,#F4A63A 55%,#E58E24 100%);
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-body:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-ur:"Noto Nastaliq Urdu","Archivo",serif;
  --gx:clamp(16px,4vw,48px); --wrap:1180px; --r:18px; --hdr:68px;
  --ease:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --shadow:0 30px 70px -30px rgba(0,0,0,.85);
  interpolate-size:allow-keywords;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr) + 16px);background:var(--bg)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
img,video,canvas,svg{display:block;max-width:100%}
img{height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p,figure,blockquote,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--amber-2);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
::selection{background:var(--amber);color:#1C1205}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gx)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- background (kept from v1) ---------- */
#bg-gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s var(--ease)}
#bg-gl.on{opacity:1}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60vmax 40vmax at 85% -10%,rgba(255,122,26,.10),transparent 60%),radial-gradient(50vmax 40vmax at -10% 30%,rgba(226,54,26,.07),transparent 60%)}
#main{position:relative;z-index:1}
.rv-off .rv{transition:none!important;opacity:1!important;transform:none!important;filter:none!important}

/* ---------- type ---------- */
.display{font-family:var(--f-display);font-weight:400;text-transform:uppercase;line-height:.96;letter-spacing:.005em;color:var(--ink);text-wrap:balance}
.display em,.h2 em,.amber{font-style:normal;background:var(--amber-text);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(38px,4.4vw,62px);line-height:1;letter-spacing:.005em;color:var(--ink);text-wrap:balance}
.h3{font:700 18px/1.3 var(--f-body)}
.kicker{font:700 11.5px/1.2 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--amber)}
.lead{color:var(--ink-2);font-size:clamp(15px,1.1vw,17px);line-height:1.65;max-width:60ch}
.prose p{color:var(--ink-2);font-size:16px;line-height:1.8}
.prose p+p{margin-top:16px}
.prose b{color:var(--ink)}
:root[lang="ur"] body{font-family:var(--f-ur)}
:root[lang="ur"] .display,:root[lang="ur"] .h2,:root[lang="ur"] .buy h1,:root[lang="ur"] .facts-h{font-family:var(--f-ur);text-transform:none;font-weight:700;line-height:1.75;letter-spacing:0}
:root[lang="ur"] .h2{font-size:clamp(26px,3.2vw,46px)}
:root[lang="ur"] .kicker,:root[lang="ur"] .opt label,:root[lang="ur"] .trust span,:root[lang="ur"] .foot h3,:root[lang="ur"] .pstats span,:root[lang="ur"] .hint{letter-spacing:0;font-family:var(--f-ur);font-size:13.5px;line-height:2}
:root[lang="ur"] .lead,:root[lang="ur"] .prose p,:root[lang="ur"] p{line-height:2.1}
:root[lang="ur"] .ln{padding-block:.25em .4em;margin-block:-.25em -.4em}

/* ---------- buttons ---------- */
.btn{--h:46px;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:var(--h);padding-inline:24px;border-radius:999px;font:650 14.5px/1 var(--f-body);white-space:nowrap;position:relative;overflow:hidden;isolation:isolate;transition:transform .45s var(--ease),box-shadow .45s var(--ease),background-color .3s,border-color .3s,color .3s}
.btn svg{width:17px;height:17px;flex:none}
.btn .arr{transition:transform .45s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
[dir="rtl"] .btn .arr{transform:scaleX(-1)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}
.btn--primary{background:var(--grad);color:#1C1205;box-shadow:0 10px 28px -12px rgba(244,166,58,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.btn--primary::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:260% 100%;background-position:130% 0;transition:background-position 1s var(--ease)}
.btn--primary:hover{transform:translateY(-2px);box-shadow:0 18px 38px -14px rgba(244,166,58,.95),inset 0 1px 0 rgba(255,255,255,.35)}
.btn--primary:hover::after{background-position:-30% 0}
.btn--ghost{background:rgba(255,255,255,.035);border:1px solid var(--line-2);color:var(--ink)}
.btn--ghost:hover{border-color:rgba(244,166,58,.6);color:var(--amber-2);transform:translateY(-2px)}
.btn--green{background:var(--wa);color:#fff}
.btn--green:hover{transform:translateY(-2px);background:#22c95f}
.btn--sm{--h:38px;padding-inline:18px;font-size:13.5px;gap:7px}
.btn--sm svg{width:15px;height:15px}
.btn--block{width:100%}
.ibtn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:background .3s,border-color .3s,color .3s;position:relative;flex:none}
.ibtn:hover{background:rgba(255,255,255,.1);border-color:var(--line-2)}
.ibtn svg{width:19px;height:19px}
.stars{display:inline-flex;gap:2px;color:var(--amber)}
.stars svg{width:14px;height:14px}

/* ---------- header ---------- */
.hdr{position:fixed;top:0;inset-inline:0;z-index:60;height:var(--hdr);background:rgba(9,8,10,.62);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid transparent;transition:background .5s,border-color .5s}
.hdr.solid{background:rgba(9,8,10,.86);border-bottom-color:var(--line)}
.hdr__in{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-inline:clamp(16px,2.4vw,36px)}
.logo{display:inline-flex;align-items:center;justify-self:start}
.logo img{width:40px;height:auto;filter:drop-shadow(0 4px 14px rgba(255,122,26,.35));transition:transform .5s var(--ease)}
.logo:hover img{transform:scale(1.06) rotate(-3deg)}
.nav{display:flex;align-items:center;gap:clamp(16px,1.8vw,28px)}
.nav a{font:500 14.5px/1 var(--f-body);color:#E8E3DB;padding-block:10px;transition:color .3s;white-space:nowrap}
.nav a:hover{color:var(--amber-2)}
.nav a.on{color:var(--amber)}
:root[lang="ur"] .nav a{font-family:var(--f-ur);font-size:14.5px;line-height:1.4}
.hdr__act{justify-self:end;display:flex;align-items:center;gap:10px}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:19px;height:19px;padding-inline:5px;border-radius:10px;background:var(--grad);color:#1C1205;font:800 11px/19px var(--f-body);text-align:center;transform:scale(0);transition:transform .5s var(--ease)}
.badge.on{transform:scale(1)}
.badge.bump{animation:bump .6s var(--ease)}
@keyframes bump{30%{transform:scale(1.45)}100%{transform:scale(1)}}
.burger{display:none}
@media (max-width:1060px){.nav{display:none}.burger{display:inline-grid}.hdr__in{grid-template-columns:auto 1fr auto}.hdr__act{grid-column:3}}
@media (max-width:520px){.hdr__cta{display:none}}

.lang{display:inline-flex;height:36px;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.lang span{display:inline-grid;place-items:center;min-width:40px;padding-inline:8px;border-radius:999px;font:650 12px/1 var(--f-body);color:var(--mute);transition:background .4s var(--ease),color .4s}
.lang span.ur{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:14px;padding-top:3px}:root[lang="ur"] .lang span.ur{font-family:var(--f-ur)}
.lang span.on{background:var(--grad);color:#1C1205}

/* mobile menu */
.menu{position:fixed;inset:0;z-index:90;background:radial-gradient(80vmax 60vmax at 100% 0,rgba(244,166,58,.18),transparent 60%),#0A0908;clip-path:circle(0 at calc(100% - 40px) 34px);transition:clip-path .9s var(--ease);display:flex;flex-direction:column;padding:18px var(--gx) 30px}
[dir="rtl"] .menu{clip-path:circle(0 at 40px 34px)}
body.menu-open .menu{clip-path:circle(150% at calc(100% - 40px) 34px)}
[dir="rtl"] body.menu-open .menu{clip-path:circle(150% at 40px 34px)}
.menu__top{display:flex;justify-content:space-between;align-items:center}
.menu__links{margin-block:auto;display:flex;flex-direction:column}
.menu__links a{display:flex;align-items:center;justify-content:space-between;font:400 clamp(38px,10vw,64px)/1.15 var(--f-display);text-transform:uppercase;padding-block:6px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(36px);transition:opacity .6s var(--ease),transform .8s var(--ease),color .3s}
.menu__links a svg{width:30px;height:30px;color:var(--amber)}
.menu__links a.on{color:var(--amber)}
:root[lang="ur"] .menu__links a{font-family:var(--f-ur);text-transform:none;font-size:clamp(26px,7vw,40px);line-height:1.9}
body.menu-open .menu__links a{opacity:1;transform:none}
body.menu-open .menu__links a:nth-child(2){transition-delay:.05s}body.menu-open .menu__links a:nth-child(3){transition-delay:.1s}body.menu-open .menu__links a:nth-child(4){transition-delay:.15s}body.menu-open .menu__links a:nth-child(5){transition-delay:.2s}body.menu-open .menu__links a:nth-child(6){transition-delay:.25s}
.menu__foot{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;color:var(--ink-2);font-size:14px}

/* ---------- route transition, intro ---------- */
#main{transition:opacity .38s var(--ease-io),transform .5s var(--ease-io),filter .38s var(--ease-io)}
#main.leaving{opacity:0;transform:translateY(-14px);filter:blur(6px)}
#main.entering{opacity:0;transform:translateY(22px);filter:blur(6px);transition:none}
.routebar{position:fixed;top:0;inset-inline-start:0;height:3px;width:100%;z-index:120;background:var(--grad);transform-origin:left;transform:scaleX(0);opacity:0;pointer-events:none}
[dir="rtl"] .routebar{transform-origin:right}
.routebar.go{opacity:1;transform:scaleX(.7);transition:transform .4s var(--ease)}
.routebar.done{opacity:0;transform:scaleX(1);transition:transform .35s var(--ease),opacity .4s .25s}
.intro{position:fixed;inset:0;z-index:150;background:#050404;display:grid;place-items:center;transition:clip-path 1.1s var(--ease);clip-path:inset(0 0 0 0)}
.intro.out{clip-path:inset(0 0 100% 0)}
.intro__in{display:flex;flex-direction:column;align-items:center;gap:22px}
.intro__in img{width:92px;animation:introPop 1s var(--ease) both}
.intro__word{font:400 clamp(44px,8vw,110px)/.95 var(--f-display);text-transform:uppercase;background:linear-gradient(90deg,#F6F3EE 0 var(--p,0%),rgba(246,243,238,.12) var(--p,0%) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro__bar{width:180px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.intro__bar i{display:block;height:100%;background:var(--grad);width:var(--p,0%)}
@keyframes introPop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}

/* ---------- hero stage ---------- */
.stage{position:relative;height:calc(100svh + 520vh)}
.stage__pin{position:sticky;top:0;height:100svh;overflow:hidden;background:#000;isolation:isolate}
.scene{position:absolute;inset:0;pointer-events:none}
.layer{position:absolute;inset:0;z-index:1;opacity:0;will-change:opacity,transform}
.layer video{position:relative;width:100%;height:100%;object-fit:cover}
.stage__gl{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.stage__pin::before{content:"";position:absolute;inset:0 0 auto 0;height:24vh;z-index:4;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.stage__pin::after{content:"";position:absolute;inset:auto 0 0 0;height:22vh;z-index:4;pointer-events:none;background:linear-gradient(transparent,rgba(7,6,8,.8) 70%,var(--bg))}
.copy{position:absolute;z-index:5;top:var(--hdr);bottom:0;display:flex;flex-direction:column;justify-content:center;gap:18px;pointer-events:none}
.copy::before{content:"";position:absolute;inset:0 -30%;z-index:-1;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);opacity:var(--vis,0);pointer-events:none}
.copy.live a,.copy.live button{pointer-events:auto}
.copy--left{inset-inline-start:7vw;width:min(31vw,600px);padding-bottom:6vh}
.copy--left .display{font-size:clamp(58px,6vw,124px)}
.copy--right{inset-inline-end:7.5vw;width:min(40vw,700px);align-items:flex-end;text-align:end;padding-bottom:4vh}
.copy--right .display{font-size:clamp(52px,5.4vw,112px)}
.copy--right .display em{background:none;color:var(--ink);-webkit-text-fill-color:currentColor}
.copy--center{inset-inline:0;margin-inline:auto;width:min(1040px,90vw);align-items:center;text-align:center;padding-bottom:10vh}
.copy--center .display{font-size:clamp(50px,5.6vw,116px)}
.copy .lead{text-shadow:0 2px 18px rgba(0,0,0,.75);max-width:34ch;font-size:clamp(15px,1.15vw,19px);color:#E4DED5}
.copy--center .lead{max-width:44ch}
.ln{display:block;overflow:hidden;padding-block:.04em .08em;margin-block:-.04em -.08em}
.ln>span{display:block;will-change:transform}
.fx{will-change:transform,opacity,filter}
.stage:not(.static) .fx{opacity:0}
.stage:not(.static) .ln>span{transform:translateY(130%)}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.hint{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font:600 10.5px/1 var(--f-body);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-2)}
.hint svg{width:14px;height:14px;color:var(--amber);animation:hintBob 1.8s var(--ease) infinite}
@keyframes hintBob{50%{transform:translateY(4px)}}
:root[lang="ur"] .copy .display{font-size:clamp(34px,4.2vw,76px);line-height:1.6}
.stage.static{height:auto}
.stage.static .stage__pin{position:static;height:auto;overflow:visible;background:none}
.stage.static .stage__pin::before,.stage.static .stage__pin::after,.stage.static .stage__gl{display:none}
.stage.static .scene{position:relative;height:100svh;overflow:hidden;pointer-events:auto}
.stage.static .layer{opacity:1}
.stage.static .copy{pointer-events:auto;--vis:1}
@media (max-width:860px){
  .layer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,8,.25) 0%,rgba(7,6,8,.55) 35%,rgba(7,6,8,.88) 72%)}
  .copy,.copy--left,.copy--right,.copy--center{inset-inline:var(--gx);width:auto;align-items:flex-start;text-align:start;justify-content:flex-end;padding-bottom:110px}
  .copy .display,.copy--left .display,.copy--right .display,.copy--center .display{font-size:clamp(50px,14vw,84px)}
  .copy::before{inset:-30% -20% -10%}
}

/* hero scene 1: two copies of the film, cross-dissolved at the loop point */
.layer--loop video{position:absolute;inset:0}
.layer--loop video,.layer--loop .layer__still{will-change:transform;transform:scale(1.02)}
/* hero scene 2: the tub in 3D, and its details panel */
.layer--tub{background:radial-gradient(60% 60% at 42% 50%,#1b140d 0%,#0b0908 55%,#050405 100%)}
.layer__still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.layer--tub.has-gl .layer__still{display:none}
.tub-gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:pan-y}
.scene.live .tub-gl{pointer-events:auto}
.tub-gl.over{cursor:pointer}
.tub-gl.grabbing{cursor:grabbing}
.tubcue{display:inline-flex;align-items:center;gap:11px;margin-top:4px;padding:11px 18px 11px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(244,166,58,.42);color:var(--ink);font:600 13.5px/1 var(--f-body);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;transition:background .3s,border-color .3s}
.tubcue:hover{background:rgba(244,166,58,.14);border-color:var(--amber)}
.tubcue__dot{position:relative;flex:none;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.tubcue__dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--amber);animation:cuePing 1.8s var(--ease) infinite}
@keyframes cuePing{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.scene[data-i="1"] .copy{transition:opacity .6s var(--ease) .2s,transform .9s var(--ease) .2s}
.stage.tub-open .scene[data-i="1"] .copy{opacity:0;transform:translateX(40px);transition-delay:0s;pointer-events:none}
.stage.tub-open .scene[data-i="1"] .copy *{pointer-events:none}
.tubpanel{position:absolute;z-index:6;top:calc(var(--hdr) + 3vh);bottom:5vh;inset-inline-end:clamp(16px,5vw,80px);width:min(440px,38vw);display:flex;flex-direction:column;gap:18px;padding:24px 26px;border-radius:22px;background:linear-gradient(180deg,rgba(26,21,18,.8),rgba(12,10,12,.74));border:1px solid rgba(255,240,220,.12);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 40px 100px -40px rgba(0,0,0,.95);overflow:auto;overscroll-behavior:contain;opacity:0;transform:translateX(48px);pointer-events:none;transition:opacity .5s var(--ease),transform .8s var(--ease)}
.stage.tub-open .tubpanel{opacity:1;transform:none;pointer-events:auto;transition-delay:.15s}
.tubpanel__top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tubpanel__back{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px 0 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--ink);font:600 14px/1 var(--f-body);cursor:pointer;transition:background .3s,border-color .3s}
.tubpanel__back:hover{background:rgba(244,166,58,.14);border-color:rgba(244,166,58,.6)}
.tubpanel__back svg{width:16px;height:16px;transform:scaleX(-1);transition:transform .4s var(--ease)}
.tubpanel__back:hover svg{transform:scaleX(-1) translateX(3px)}
[dir="rtl"] .tubpanel__back svg{transform:none}
[dir="rtl"] .tubpanel__back:hover svg{transform:translateX(3px)}
.tubpanel__h{font:400 clamp(34px,3vw,46px)/1 var(--f-display);text-transform:uppercase;color:var(--ink);margin:6px 0 10px}
.tubpanel .rating{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.tubpanel__price{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px}
.tubpanel__price b{font:400 42px/1 var(--f-display);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tubpanel__price s{color:var(--mute);font-size:15px}
.tubpanel__off{align-self:center;padding:5px 10px;border-radius:999px;background:rgba(244,166,58,.14);color:var(--amber);font:700 12px/1 var(--f-body)}
.tubpanel__stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tubpanel__stats div{padding:12px 6px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center}
.tubpanel__stats b{display:block;font:400 22px/1 var(--f-display);color:var(--amber)}
.tubpanel__stats span{display:block;margin-top:6px;font-size:10.5px;line-height:1.3;color:var(--ink-2)}
.tubpanel .checklist{margin:0}
.tubpanel__act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.tubpanel__hint{margin:0;text-align:center;font-size:12px;color:var(--mute)}
:root[lang="ur"] .tubpanel__h{font-family:var(--f-ur);font-weight:700;text-transform:none;line-height:1.7;font-size:30px}
:root[lang="ur"] .tubcue,:root[lang="ur"] .tubpanel__back{font-family:var(--f-ur);line-height:1.6}
html.lock{overflow:hidden}
@media (max-width:860px){
  .tubpanel{top:auto;bottom:12px;inset-inline:12px;width:auto;max-height:58svh;padding:18px;gap:14px;transform:translateY(48px)}
  .tubpanel__act{grid-template-columns:1fr}
  .stage.tub-open .scene[data-i="1"] .copy{transform:translateY(30px)}
}

/* ---------- trust strip ---------- */
.trust{position:relative;z-index:2;background:#0E0D11;border-block:1px solid var(--line)}
.trust__in{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:16px var(--gx)}
.trust span{display:inline-flex;align-items:center;gap:22px;font:700 11.5px/1.2 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#E9E4DC}
.trust span+span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none}

/* ---------- sections ---------- */
.section{position:relative;padding-block:clamp(72px,9vw,128px)}
.section--tight{padding-block:clamp(48px,6vw,88px)}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:clamp(30px,3.8vw,50px)}
.head .lead{max-width:58ch}
.head--left{align-items:flex-start;text-align:start}
.rv{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity 1s var(--ease),transform 1.1s var(--ease),filter 1s var(--ease);transition-delay:calc(var(--d,0) * 80ms)}
.rv.in{opacity:1;transform:none;filter:none}

/* product cards */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pgrid--4{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pgrid--2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:820px;margin-inline:auto}
.pcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.pcard.rv.in{transition:opacity 1s var(--ease) calc(var(--d,0) * 80ms),filter 1s var(--ease) calc(var(--d,0) * 80ms),transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.pcard:hover{transform:translateY(-6px);border-color:rgba(244,166,58,.32);box-shadow:0 30px 60px -32px rgba(244,166,58,.4)}
.pcard__media{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:#1B1A1F}
.pcard__media img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.pcard:hover .pcard__media img{transform:scale(1.05)}
.pcard__badge{position:absolute;top:12px;inset-inline-start:12px;padding:6px 10px;border-radius:999px;background:var(--grad);color:#1C1205;font:800 12px/1 var(--f-body)}
.pcard__body{display:flex;flex-direction:column;gap:7px;padding:18px 20px 20px;flex:1}
.pcard__name{font:700 18px/1.25 var(--f-body);color:var(--ink)}
.pcard__name i{font-style:normal;color:var(--amber)}
.pcard__body p{color:var(--mute);font-size:13.5px;line-height:1.5}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:auto;padding-top:8px}
.price b{font:400 28px/1 var(--f-display);color:var(--amber);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.price s{font-size:13px;color:var(--mute)}
.pcard .btn{margin-top:12px}
.pcard--sm .pcard__body{padding:16px 16px 18px}
.pcard--sm .pcard__name{font-size:16px}
.pcard--sm .pcard__body p{font-size:12.5px}
.pcard--sm .price b{font-size:24px}
:root[lang="ur"] .pcard__name{line-height:1.9}
@media (max-width:1060px){.pgrid--4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid>:nth-child(3):last-child{grid-column:1/-1}.pgrid>:nth-child(3):last-child .pcard__media{aspect-ratio:16/10}}
@media (max-width:600px){.pgrid,.pgrid--4{grid-template-columns:minmax(0,1fr)}.pgrid>:nth-child(3):last-child .pcard__media{aspect-ratio:1}}

/* why */
.why{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5.4vw,80px);align-items:center}
.why__img{border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow);transform:translate3d(0,var(--py,0px),0);will-change:transform;cursor:zoom-in;display:block;width:100%}
.why__img img{width:100%;display:block}
.why__txt{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.checklist{display:flex;flex-direction:column;gap:12px}
.checklist li{display:flex;gap:12px;align-items:center;color:#E7E2DA;font-size:15px;line-height:1.45}
.ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(244,166,58,.16);color:var(--amber)}
.ck svg{width:12px;height:12px}
@media (max-width:900px){.why{grid-template-columns:minmax(0,1fr)}.why__img{max-width:520px}}

/* certificates, facts */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cert{display:flex;flex-direction:column;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.cert.rv.in{transition:opacity 1s var(--ease) calc(var(--d,0) * 80ms),filter 1s var(--ease) calc(var(--d,0) * 80ms),transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.cert:hover{transform:translateY(-5px);border-color:var(--line-2);box-shadow:0 24px 50px -30px rgba(0,0,0,.9)}
.cert__img{display:block;aspect-ratio:4/3;background:#F1EDE6;overflow:hidden}
.cert__img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform 1.2s var(--ease)}
.cert:hover .cert__img img{transform:scale(1.04)}
.cert--fact .cert__img{aspect-ratio:1;background:#131216}
.cert--fact .cert__img img{object-position:center}
.cert__body{padding:13px 16px 15px;font:600 13.5px/1.4 var(--f-body);color:var(--ink)}
.facts-h{font:400 clamp(24px,2.3vw,34px)/1 var(--f-display);text-transform:uppercase;text-align:center;margin:clamp(48px,6vw,76px) 0 24px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,320px));gap:18px;justify-content:center}
@media (max-width:860px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cgrid,.fgrid{grid-template-columns:minmax(0,1fr)}}

/* reviews */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:11px;transition:border-color .4s,transform .6s var(--ease)}
.tcard.rv.in{transition:opacity 1s var(--ease) calc(var(--d,0) * 80ms),filter 1s var(--ease) calc(var(--d,0) * 80ms),transform .6s var(--ease),border-color .4s}
.tcard:hover{border-color:var(--line-2);transform:translateY(-4px)}
.tcard h3{font:700 14.5px/1.4 var(--f-body)}
.tcard p{color:var(--ink-2);font-size:14px;line-height:1.7;flex:1}
.tcard footer{font-size:13px;color:var(--mute)}
.tcard footer b{color:var(--ink);font-weight:700}
@media (max-width:900px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tgrid{grid-template-columns:minmax(0,1fr)}}

/* video reel */
.reel{--per:3;position:relative;padding-inline:58px}
.reel__vp{overflow:hidden;border-radius:16px}
.reel__track{display:flex;gap:18px;transition:transform .9s var(--ease);will-change:transform;touch-action:pan-y}
.vt{flex:0 0 calc((100% - (var(--per) - 1) * 18px) / var(--per));aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#151418;border:1px solid var(--line)}
.vt video{width:100%;height:100%;object-fit:cover;background:#000}
.reel__arr{position:absolute;top:50%;z-index:2;width:42px;height:42px;margin-top:-21px;border-radius:50%;border:1px solid rgba(244,166,58,.45);display:grid;place-items:center;color:var(--amber);background:rgba(10,9,11,.6);backdrop-filter:blur(6px);transition:background .3s,opacity .3s,transform .4s var(--ease)}
.reel__arr svg{width:18px;height:18px}
.reel__arr:hover:not(:disabled){background:var(--grad);color:#1C1205;transform:scale(1.06)}
.reel__arr:disabled{opacity:.3}
.reel__arr.prev{inset-inline-start:0}
.reel__arr.next{inset-inline-end:0}
.reel__arr.prev svg{transform:scaleX(-1)}
[dir="rtl"] .reel__arr.prev svg{transform:none}
[dir="rtl"] .reel__arr.next svg{transform:scaleX(-1)}
.reel__dots{display:flex;justify-content:center;gap:6px;margin-top:22px}
.reel__dots button{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.22);transition:width .5s var(--ease),background .4s}
.reel__dots button.on{width:24px;background:var(--grad)}
@media (max-width:640px){.reel{padding-inline:0}.reel__arr{top:auto;bottom:-6px;margin-top:0}.reel__dots{margin-top:30px}}

/* product-page studio film */
.film-wide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.film-wide::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.film-wide{position:relative;margin:clamp(36px,4vw,52px) 0 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:21/9}
.film-wide::after{background:linear-gradient(90deg,rgba(7,6,8,.78),rgba(7,6,8,0) 55%)}
[dir="rtl"] .film-wide::after{background:linear-gradient(270deg,rgba(7,6,8,.78),rgba(7,6,8,0) 55%)}
.film-wide figcaption{position:absolute;z-index:2;inset-inline-start:clamp(18px,3.2vw,40px);bottom:clamp(16px,3vw,36px);max-width:min(440px,60%);display:flex;flex-direction:column;gap:8px}
.film-wide figcaption b{font:400 clamp(26px,3.4vw,46px)/1 var(--f-display);text-transform:uppercase;color:var(--ink);text-wrap:balance}
@media (max-width:640px){.film-wide{aspect-ratio:16/11}.film-wide figcaption{max-width:80%}}
[lang="ur"] .film-wide figcaption b{font-family:var(--f-ur);font-weight:700;text-transform:none;line-height:1.7;font-size:clamp(17px,1.6vw,22px)}

/* faq */
.fq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;max-width:1060px;margin-inline:auto}
.fq__col{display:flex;flex-direction:column;gap:14px;min-width:0}
.fq__item{background:var(--card);border:1px solid var(--line);border-radius:14px}
.fq__item.rv.in{transition:opacity 1s var(--ease) calc(var(--d,0) * 80ms),filter 1s var(--ease) calc(var(--d,0) * 80ms),transform 1.1s var(--ease) calc(var(--d,0) * 80ms),border-color .4s,background-color .4s}
.fq__item:hover{border-color:var(--line-2)}
.fq__item.open{border-color:rgba(244,166,58,.34);background-color:#141217}
.fq h3{margin:0;font:inherit}
.fq__q{width:100%;display:flex;align-items:center;gap:14px;padding:18px 18px 18px 20px;text-align:start;font:700 15px/1.45 var(--f-body);color:var(--ink);background:none;border:0;cursor:pointer;border-radius:14px}
.fq__q::before{content:"";flex:none;width:5px;height:14px;border-radius:2px;background:var(--grad)}
.fq__q:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.fq__ic{position:relative;flex:none;margin-inline-start:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);transition:background .35s,border-color .35s,transform .6s var(--ease)}
.fq__ic::before,.fq__ic::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:1.8px;margin:-.9px 0 0 -5.5px;border-radius:1px;background:var(--amber);transition:transform .6s var(--ease),background .35s}
.fq__ic::after{transform:rotate(90deg)}
.fq__q:hover .fq__ic{border-color:rgba(244,166,58,.5)}
.fq__item.open .fq__ic{background:var(--grad);border-color:transparent;transform:rotate(180deg)}
.fq__item.open .fq__ic::before,.fq__item.open .fq__ic::after{background:#1C1205}
.fq__item.open .fq__ic::after{transform:rotate(0deg)}
.fq__a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.fq__a>div{overflow:hidden;min-height:0}
.fq__a p{margin:0;padding-block:0 18px;padding-inline:39px 22px;color:var(--ink-2);font-size:14px;line-height:1.7;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .55s var(--ease)}
.fq__item.open .fq__a{grid-template-rows:1fr}
.fq__item.open .fq__a p{opacity:1;transform:none;transition-delay:.08s}
:root[lang="ur"] .fq__q{font-family:var(--f-ur);font-weight:600;line-height:2}
@media (max-width:760px){.fq{grid-template-columns:minmax(0,1fr)}.fq__q{padding:16px 14px 16px 16px;font-size:14.5px}.fq__a p{padding-inline:35px 16px}}

/* cta */
.cta{position:relative;overflow:hidden;text-align:center;border-radius:22px;padding:clamp(40px,6vw,76px) clamp(20px,4vw,48px);background:radial-gradient(60% 120% at 50% 0%,rgba(244,166,58,.13),transparent 60%),linear-gradient(180deg,#17151A,#0E0D11);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:16px}
.cta .display{font-size:clamp(34px,4.6vw,66px)}
.cta .actions{justify-content:center;margin-top:8px}
:root[lang="ur"] .cta .display{font-size:clamp(26px,3.2vw,48px)}

/* ---------- product page ---------- */
.pv-banner{position:relative;padding-top:var(--hdr);background:#0B0A0C}
/* product film hero (creatine): the clip sits to the right, the banner copy to the left */
.pv-hero{position:relative;padding-top:var(--hdr);background:#060507;overflow:hidden;isolation:isolate}
.pv-hero__media{position:relative;height:clamp(460px,min(78vh,50vw),860px)}
.pv-hero__media>img,.pv-hero__media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateX(19%) scale(1.02)}
.pv-hero__media video{opacity:0}
.pv-hero__media::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(90deg,#060507 0%,#060507 14%,rgba(6,5,7,.82) 30%,rgba(6,5,7,0) 54%),linear-gradient(180deg,rgba(6,5,7,.5),transparent 18%,transparent 70%,var(--bg))}
[dir="rtl"] .pv-hero__media>img,[dir="rtl"] .pv-hero__media video{transform:translateX(-19%) scale(1.02)}
[dir="rtl"] .pv-hero__media::after{background:linear-gradient(270deg,#060507 0%,#060507 14%,rgba(6,5,7,.82) 30%,rgba(6,5,7,0) 54%),linear-gradient(180deg,rgba(6,5,7,.5),transparent 18%,transparent 70%,var(--bg))}
.pv-hero__copy{position:absolute;z-index:6;inset:var(--hdr) 0 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,1.6vw,22px);pointer-events:none}
.pv-hero__copy>*{max-width:min(620px,48vw)}
.pv-hero__title{margin:0;font:400 clamp(70px,8.6vw,150px)/.9 var(--f-display);text-transform:uppercase;color:#fff;letter-spacing:.005em}
.pv-hero__title .ln{display:block}
.pv-hero__line2{font-size:.33em;line-height:1.05;margin-top:.12em}
.pv-hero__title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pv-hero__sub{margin:0;color:#E4DED5;font-size:clamp(15px,1.25vw,20px);line-height:1.5}
.pv-hero__stats{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;row-gap:14px}
.pv-hero__stats li{display:grid;gap:4px;padding-inline:clamp(14px,1.6vw,26px);border-inline-start:2px solid var(--amber)}

// Default selection per product (first tier, first flavour).
function defaultSelection(p) {
  return { tier: p.tiers[0].key, flavor: p.flavors[0].key };
}

function variantOf(p, sel) {
  return p.variants[`${sel.tier}:${sel.flavor}`];
}

function imageOf(p, sel) {
  if (p.flavorImages) return p.flavorImages[`${sel.tier}:${sel.flavor}`];
  return p.flavors.find((f) => f.key === sel.flavor)?.images[0] ?? p.card;
}

function stars(n) {
  let s = "";
  for (let i = 1; i <= 5; i++) s += i <= Math.floor(n) ? icons.star : i - n < 1 && i - n > 0 ? icons.starHalf : `<span style="opacity:.25">${icons.star}</span>`;
  return `<span class="stars">${s}</span>`;
}

function tubR(row) {
  if (row <= TUB.top + 6) return 0.965 + 0.035 * Math.sin((((row - TUB.top) / 6) * Math.PI) / 2);

const RIB_V = /* glsl */ `

void main(){

/* ================================================================
   router with a soft cross-page transition
   ================================================================ */
const ROUTES = { "": "home", home: "home", products: "home", certificates: "home", whey: "whey", creatine: "creatine", stack: "stack", about: "about", contact: "contact" };
const parse = (h) => { const k = (h || "").replace(/^#\/?/, "").toLowerCase(); return { view: ROUTES[k] || "home", anchor: k === "products" || k === "certificates" ? k : null }; };
const build = (v) => (v === "home" ? viewHome() : v === "about" ? viewAbout() : v === "contact" ? viewContact() : viewProduct(v));
const main = $("#main");
let current = null, cleanup = null, bgDust = null, navigating = false, HASH = location.hash;
function navTo(href) { HASH = href; try { if (location.hash !== href) history.pushState(null, "", href); } catch {} go(); }
function setNav(view) {
  $$("[data-r]").forEach((a) => a.classList.toggle("on", a.dataset.r === view));
  const cta = $("#hdr-cta");
  if (cta) { const pv = !!PRODUCTS[view]; cta.textContent = pv ? t("x.buyNow") : t("nav.shop"); cta.setAttribute("href", pv ? "#buy" : "#/products"); }
}
function mountView(r, { keepY = null } = {}) {
  cleanup?.(); cleanup = null;
  const v = build(r.view);
  main.innerHTML = v.html;
  document.title = v.title;
  if (keepY == null) jumpTop(0); else jumpTop(keepY);
  cleanup = v.mount() || null;
  reveals(main);
  lazyPosters(main);
  parEls = REDUCE ? [] : $$("[data-par]", main); parAt = ""; kick();
  setNav(r.view);
  bgDust?.setPreset(v.preset);
  current = r;
}
async function go(force = false) {
  const r = parse(HASH);
  if (current && r.view === current.view && !force) { current = r; if (r.anchor) scrollToEl($("#" + r.anchor)); else scrollToY(0, 1.2); setNav(r.view); return; }
  if (navigating) return;
  navigating = true;
  const bar = $("#routebar");
  if (current && !REDUCE) { bar.className = "routebar go"; main.classList.add("leaving"); await wait(380); }
  mountView(r);
  if (current && !REDUCE) {
    main.classList.remove("leaving"); main.classList.add("entering"); void main.offsetWidth; main.classList.remove("entering");
    bar.className = "routebar done";
  }
  navigating = false;
  if (r.anchor) setTimeout(() => scrollToEl($("#" + r.anchor), 1.6), REDUCE ? 0 : 420);
  if (parse(HASH).view !== r.view) go();
}
function renderShell() {
  $("#shell-top").innerHTML = shellTop();
  $("#shell-bottom").innerHTML = shellBottom();
  renderCart();
  onScrollHeader();
}
function setLang(l) {
  LANG = DICT[l] ? l : "en";
  try { localStorage.setItem("am-lang", LANG); } catch {}
  applyLangAttrs();
  const y = scrollY;
  renderShell();
  mountView(current || parse(HASH), { keepY: y });
}

/* ---------------- events ---------------- */
function onScrollHeader() { const h = $("#hdr"); if (h) h.classList.toggle("solid", scrollY > 24); }
addEventListener("scroll", onScrollHeader, { passive: true });
addEventListener("hashchange", () => { HASH = location.hash; go(); });
addEventListener("popstate", () => { HASH = location.hash; go(); });
document.addEventListener("click", (e) => {
  const el = e.target.closest("a,button,[data-close-cart],[data-close-menu]"); if (!el) return;
  if (el.matches("[data-close-menu]")) setMenu(false);
  if (el.matches("[data-close-cart]")) closeCart();
  const href = el.getAttribute("href");
  if (href && href.startsWith("#/")) { e.preventDefault(); navTo(href); return; }
  if (href && href.startsWith("#") && href.length > 1) { e.preventDefault(); scrollToEl($(href)); return; }
  if (el.matches("[data-lang-toggle]")) return setLang(LANG === "en" ? "ur" : "en");
  if (el.id === "cart-btn") return openCart();
  if (el.id === "burger") return setMenu(true);
  if (el.id === "lb-x") { $("#lb").close(); return; }
  if (el.dataset.add) { cart.add(el.dataset.add, el.dataset.variant, 1); toast(t("cart.added")); openCart(); return; }
  if (el.dataset.inc != null) return cart.setQty(+el.dataset.inc, cart.items()[+el.dataset.inc].qty + 1);
  if (el.dataset.dec != null) return cart.setQty(+el.dataset.dec, cart.items()[+el.dataset.dec].qty - 1);
  if (el.dataset.rm != null) return cart.remove(+el.dataset.rm);
  if (el.dataset.lightbox) return openLightbox(A(el.dataset.lightbox), el.dataset.caption || "");
  if (el.classList.contains("fq__q")) {
